[project]
name = "odelab"
version = "0.1.0"
description = "A tiny 1D ODE integrator — practice repo for the Agentic AI for Coding workshop."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["odelab"]
